# Every Monday: download the last week's matches from Cricsheet, generate a
# report for each, add an AI-written story, and commit the results to
# reports/. Run it by hand any time from the Actions tab.
#
# Stories: add a free GROQ_API_KEY secret (console.groq.com/keys), or an
# ANTHROPIC_API_KEY secret to use Claude. Without either, reports are
# stats-only. Optional NARRATOR_MODEL repository variable picks the model.

name: Weekly match reports

on:
  schedule:
    - cron: "30 0 * * 1"   # 00:30 UTC Monday = 06:00 IST
  workflow_dispatch:
    inputs:
      dataset:
        description: "Cricsheet dataset (e.g. recently_added_7, ipl, t20s, odis)"
        default: "recently_added_7"
      match_type:
        description: "Only this format (T20, ODI, Test); blank for all"
        default: ""
      event:
        description: "Only events whose name contains this, e.g. Asian Games (use with t20s); blank for all"
        default: ""

permissions:
  contents: write

# One run at a time; a second run waits instead of racing the first.
concurrency:
  group: weekly-reports
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Inputs go through env vars, never pasted into the script, so any text is safe.
      - name: Download matches
        env:
          DATASET: ${{ github.event.inputs.dataset || 'recently_added_7' }}
          EVENT: ${{ github.event.inputs.event }}
        run: |
          python plugins/cricket-analytics/skills/cricket-match-report/scripts/fetch_cricsheet.py \
            "$DATASET" -o data/ ${EVENT:+--event "$EVENT"}

      - name: Generate reports
        env:
          MT: ${{ github.event.inputs.match_type }}
          EVENT: ${{ github.event.inputs.event }}
        run: |
          python automation/batch_reports.py data/ -o reports/ \
            ${MT:+--match-type "$MT"} ${EVENT:+--event "$EVENT"}

      - name: Write match stories
        continue-on-error: true   # stories are optional; never block the reports
        timeout-minutes: 15
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NARRATOR_MODEL: ${{ vars.NARRATOR_MODEL }}
        # -u: print progress live instead of buffering it until the end
        run: python -u automation/narrate.py reports/ --limit 15 --time-budget 600

      - name: Commit new reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No new reports."
            exit 0
          fi
          git commit -m "Match reports: $(date -u +%Y-%m-%d)"
          # Someone may have pushed while this run was working: replay our
          # commit on top of theirs and try again.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
